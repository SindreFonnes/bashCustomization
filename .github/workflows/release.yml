name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dependency-policy:
    name: Dependency and license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check main crate advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml

      - name: Check E2E crate advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: tests/e2e/Cargo.toml

  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install shell validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: Run validation suite
        run: tests/validate.sh

  e2e:
    name: Distro behavior tier
    needs: [validate, dependency-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run source-fresh distro behavior tier
        run: tests/e2e/run.sh

  build:
    name: Build ${{ matrix.target }}
    needs: [validate, dependency-policy, e2e]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (aarch64-linux)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a --locked

      - name: Build (cross)
        if: matrix.use_cross
        run: cd rust && cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cd rust && cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp rust/target/${{ matrix.target }}/release/bashc bashc-${{ matrix.target }}

      - name: Generate SHA256 checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum bashc-${{ matrix.target }} > bashc-${{ matrix.target }}.sha256
          else
            shasum -a 256 bashc-${{ matrix.target }} > bashc-${{ matrix.target }}.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bashc-${{ matrix.target }}
          path: |
            bashc-${{ matrix.target }}
            bashc-${{ matrix.target }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create checksums.txt
        run: |
          cat bashc-*.sha256 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bashc-x86_64-apple-darwin
            bashc-aarch64-apple-darwin
            bashc-x86_64-unknown-linux-gnu
            bashc-aarch64-unknown-linux-gnu
            bashc-x86_64-unknown-linux-musl
            bashc-*.sha256
            checksums.txt
